[project]
name = "melo-gierka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.14",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "sentry-sdk>=2.64.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.15.19",
    "basedpyright>=1.39.8",
    "pytest-playwright>=0.8.0",
    "playwright>=1.61.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "melo_gierka.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "catalog", "game"]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["catalog", "game"]
