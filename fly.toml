# fly.toml app configuration for melo-gierka
# Hardened per context/changes/deployment/deployment-plan.md Phase 7.
# See https://fly.io/docs/reference/configuration/

app = 'melo-gierka'
primary_region = 'ams'
console_command = 'uv run python manage.py shell'

[build]

[env]
  PORT = '8080'
  DJANGO_DEBUG = 'False'

[http_service]
  internal_port = 8080
  force_https = true
  # Stay always-on to protect the ≤1s polling guardrail (infrastructure.md risk #1).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
